# .spex/config.yaml — written by spex init (runner: vitest). Edit what the scan got wrong. Commit this file.
format: 3 # the shape of specs/ and .spex/; spex update changes it, nothing else does
acceptance_dir: tests/acceptance
# {ids} becomes REQ_007_001|REQ_007_002 (a regex); {ids_k} becomes "REQ_007_001 or REQ_007_002" (pytest -k)
# node --test, like test:core: vitest.config.ts includes only src/renderer/**, so vitest never finds tests/acceptance.
# npx tsc first: the acceptance tests run dist/core/cli.js, and a stale dist tests old code.
acceptance_cmd: 'npx tsc && node --import ./scripts/ts-resolve-hook.mjs --test --experimental-strip-types --test-name-pattern="{ids}" "tests/acceptance/**/*.test.ts"'
drivers: {} # more ways to run script tests: playwright: {cmd: 'npx playwright test --grep "{ids}"', dir: tests/e2e}
repos: {} # other git repos a task may write (repo: in the task): web: {path: ../web-ui}
# npm test globs src/core/** and src/renderer/** only, and typecheck covers src/ only, so a red acceptance test never fails these.
fast_checks: ["npm run typecheck", "npm test"]
source_dirs: [src] # /spex:tests never reads these
protected: [specs/, .spex/, tests/acceptance/, .github/] # no task may write these
scopes: [queue, policy, picker, gates, sensors, evidence, digest, prompts, prerequisites, clarification, agent, cli, branching, ui] # known capabilities, from src/core modules; a record with a new scope gets a warning
banned_words: [] # added to the built-in list
live: [] # real systems a test may write (github:org/repo, gitlab:group/project, cluster:laptop): the one-time yes
people: [] # names that never appear as an actor in a task or a test step
limits: {task_files: 12, instructions_bytes: 1500, approach_bytes: 1200, context_kb: 24, diff_kb: 120, file_kb: 40, tests_scenarios: 12, verify_minutes: 20, step_introduces: 10}
review_rounds: 3
verify_rounds: 3 # whole-feature verify rounds before a person reads it
auto: false # true: /spex:new and /spex:clarify let the decider agent settle what the design and the code answer, and ask you the rest in one list
commit: false
base: "" # the branch a spec starts from and merges into. Empty: the branch the main folder is on
close: {cmd: ""}
worktree: {setup: ""} # setup: runs one time in a new worktree (install the packages, copy .env)
